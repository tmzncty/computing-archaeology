name: experiment-smoke-tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install repository tool dependencies
        run: python -m pip install --require-hashes -r tools/requirements.txt
      - name: Check internal Markdown links
        run: python tools/check_internal_links.py
      - name: Compile Python sources
        run: python -m compileall -q experiments tools tests
      - name: Test repository tools
        run: python -m unittest discover -s tests -v
      - name: Run every experiment default path
        run: python tools/run_experiments.py
