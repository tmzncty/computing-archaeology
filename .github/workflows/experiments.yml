name: experiment-smoke-tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check internal Markdown links
        run: python tools/check_internal_links.py
      - name: Compile experiment sources
        run: python -m compileall -q experiments tools
      - name: Finite differences
        run: python experiments/finite-differences/finite_difference.py
      - name: Carry propagation
        run: python experiments/carry-propagation/carry_propagation.py
      - name: Relay bounce
        run: python experiments/relay-bounce/relay_bounce.py
