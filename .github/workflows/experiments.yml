name: experiment-smoke-tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check internal Markdown links
        run: python tools/check_internal_links.py
      - name: Compile experiment sources
        run: python -m compileall -q experiments tools
      - name: Finite differences
        run: python experiments/finite-differences/finite_difference.py
      - name: Carry propagation
        run: python experiments/carry-propagation/carry_propagation.py
      - name: Relay bounce
        run: python experiments/relay-bounce/relay_bounce.py
      - name: Reliability versus throughput
        run: python experiments/reliability-throughput/reliability_throughput.py
      - name: Serial memory
        run: python experiments/serial-memory/serial_memory.py
      - name: CRT refresh
        run: python experiments/crt-refresh/crt_refresh.py
      - name: Drum timing
        run: python experiments/drum-timing/drum_timing.py
      - name: Core memory
        run: python experiments/core-memory/core_memory.py
      - name: Tape locality
        run: python experiments/tape-locality/tape_locality.py
      - name: Disk locality
        run: python experiments/disk-locality/disk_locality.py
      - name: Card columns
        run: python experiments/card-columns/card_columns.py
      - name: Card sort merge
        run: python experiments/card-sort-merge/card_sort_merge.py
      - name: Bootstrap chain
        run: python experiments/bootstrap-chain/bootstrap_chain.py
      - name: Batch economics
        run: python experiments/batch-economics/batch_economics.py
      - name: TTY bandwidth budget
        run: python experiments/tty-budget/tty_budget.py
      - name: Time-sharing
        run: python experiments/time-sharing/time_sharing.py
      - name: Utility sharing
        run: python experiments/utility-sharing/utility_sharing.py
      - name: Shared bus
        run: python experiments/shared-bus/shared_bus.py
      - name: Terminal state
        run: python experiments/terminal-state/terminal_state.py
      - name: Die economics
        run: python experiments/die-economics/die_economics.py
      - name: Wafer yield
        run: python experiments/wafer-yield/wafer_yield.py
      - name: Lithography overlay
        run: python experiments/lithography-overlay/lithography_overlay.py
      - name: Process stack
        run: python experiments/process-stack/process_stack.py
      - name: Package pin budget
        run: python experiments/package-pin-budget/package_pin_budget.py
      - name: PCB routing density
        run: python experiments/pcb-routing-density/pcb_routing_density.py
      - name: Assembly defects
        run: python experiments/assembly-defects/assembly_defects.py
      - name: Text fossils
        run: python experiments/text-fossils/text_fossils.py
      - name: Endianness
        run: python experiments/endianness/endianness.py
      - name: Word packing
        run: python experiments/word-packing/word_packing.py
